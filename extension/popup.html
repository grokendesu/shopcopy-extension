<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShopCopy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>ShopCopy</h1>
    <p class="lede">SEO copy for the product you have open. No API. No chatbot.</p>
  </header>
  <label for="title">Title</label>
  <input id="title" type="text" autocomplete="off" />
  <label for="desc">Description / bullets</label>
  <textarea id="desc" rows="5"></textarea>
  <div class="row">
    <button type="button" id="gen" class="go">Generate</button>
    <button type="button" id="insert" class="ghost">Insert body</button>
  </div>
  <p id="status" class="status"></p>
  <section>
    <label>SEO title <span id="c-seo" class="count">0/70</span></label>
    <div id="out-seo" class="out"></div>
    <button type="button" class="ghost copy" data-key="seoTitle">Copy</button>
  </section>
  <section>
    <label>Meta description <span id="c-meta" class="count"></span></label>
    <div id="out-meta" class="out"></div>
    <button type="button" class="ghost copy" data-key="metaDescription">Copy</button>
  </section>
  <section>
    <label>Body HTML</label>
    <div id="out-body" class="out"></div>
    <button type="button" class="ghost copy" data-key="bodyHtml">Copy</button>
  </section>
  <section>
    <label>13 tags</label>
    <div id="out-tags" class="out"></div>
    <button type="button" class="ghost copy" data-key="tagsLine">Copy</button>
  </section>
  <script src="generate.js"></script>
  <script src="popup.js"></script>
</body>
</html>
